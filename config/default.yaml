inputs:
  # 单文件模式：适用于测试或已经合并好的 shapefile。
  road: ""
  walk: ""
  road_node: ""
  road_rule: ""
  road_node_maat: ""
  road_cross_maat: ""
  road_node_rule: ""
  road_cross_rule: ""

  # 区目录模式：一个区由多个以 mesh 命名的子文件夹组成。
  region_dir: "data/region"
  mesh_dir_glob: "*"
  road_filename: "RoadSegment.shp"
  walk_filename: "WALK_LINK.shp"
  road_node_filename: "RoadNodeRoadCross.shp"
  road_rule_filename: "RoadRule.shp"
  road_node_maat_filename: "RoadNodeMaat.shp"
  road_cross_maat_filename: "RoadCrossMaat.shp"
  road_node_rule_filename: "RoadNodeRule.shp"
  road_cross_rule_filename: "RoadCrossRule.shp"

  out_dir: "out"

output:
  mode: "both"
  file_name: "valhalla_input.osm"
  split_key: "MESH"
  osm_version: "0.6"
  generator: "fts-shp2osm"
  precision: 7
  write_statistics: true

geometry:
  target_crs: "EPSG:4326"
  snap_tolerance_m: 0.15
  preserve_shape_vertices: true
  simplify_tolerance_m: 0.0

topology:
  enabled: false
  node_coordinate_unit: "seconds"
  node_coordinate_precision: 7
  prefer_topology_nodes: true

defaults:
  road_default_speed_kph: 40
  foot_default_speed_kph: 5
  bicycle_default_speed_kph: 15
  assume_access_yes_when_unknown: true
  drop_forbidden: true
  include_private_roads: false
  use_average_speed_as_maxspeed_fallback: false
  use_speed_cate_as_maxspeed_fallback: true
  apply_road_rules: true
  apply_turn_restrictions: true

field_aliases:
  road:
    MESH: ["MESH"]
    ROAD: ["ROAD"]
    ROAD_ID: ["ROAD_ID"]
    NAME_CHN: ["NAME_CHN", "NAME", "NAMECHN"]
    NAME_ENG: ["NAME_ENG"]
    FNODE: ["FNODE", "F_NODE"]
    TNODE: ["TNODE", "T_NODE"]
    ROAD_CLASS: ["ROAD_CLASS", "ROADCLASS"]
    DIRECTION: ["DIRECTION", "DIR"]
    MAX_SPEED: ["MAX_SPEED", "MAXSPEED"]
    AVE_SPEED: ["AVE_SPEED", "AVESPEED"]
    SPEED_CATE: ["SPEED_CATE", "SPEEDCATE"]
    EXPECTIME: ["EXPECTIME", "EXPEC_TIME"]
    RULE: ["RULE"]
    RULE_CNT: ["RULE_CNT", "RULECNT"]
    S_LANES: ["S_LANES", "LANES"]
    WIDTH: ["WIDTH"]
    TOLL_FLAG: ["TOLL_FLAG", "TOLLFLAG"]
    VEHICLE: ["VEHICLE"]
    STATUS: ["STATUS"]
    FORM_WAY: ["FORM_WAY", "FORMWAY"]
    LINK_TYPE: ["LINK_TYPE", "LINKTYPE"]
    OVER_HEAD: ["OVER_HEAD", "OVERHEAD"]
    PAVER: ["PAVER"]
    OWNERSHIP: ["OWNERSHIP"]
  road_rule:
    RULE: ["RULE"]
    RULE_ID: ["RULE_ID", "RULEID"]
    RULE_FLAG: ["RULE_FLAG", "RULEFLAG"]
    RULE_TYPE: ["RULE_TYPE", "RULETYPE"]
    RULE_TIME: ["RULE_TIME", "RULETIME"]
    VEHICLE: ["VEHICLE"]
    DIR: ["DIR"]
    CODE: ["CODE"]
  road_node:
    MESH: ["MESH"]
    NODE: ["NODE"]
    NODE_ID: ["NODE_ID", "NODEID"]
    X_COORD: ["X_COORD", "XCOORD"]
    Y_COORD: ["Y_COORD", "YCOORD"]
    BOUNDARY: ["BOUNDARY"]
  road_node_maat:
    MESH: ["MESH"]
    NODE: ["NODE", "NODE_ID", "NODEID"]
    FROM_ROAD: ["FROM_ROAD", "FROMROAD"]
    TO_ROAD: ["TO_ROAD", "TOROAD"]
    RULE: ["RULE"]
    RULE_CNT: ["RULE_CNT", "RULECNT"]
  road_cross_maat:
    MESH: ["MESH"]
    NODE: ["NODE", "NODE_ID", "NODEID"]
    FROM_ROAD: ["FROM_ROAD", "FROMROAD"]
    TO_ROAD: ["TO_ROAD", "TOROAD"]
    RULE: ["RULE"]
    RULE_CNT: ["RULE_CNT", "RULECNT"]
  turn_rule:
    RULE: ["RULE"]
    RULE_ID: ["RULE_ID", "RULEID"]
    RULE_FLAG: ["RULE_FLAG", "RULEFLAG"]
    RULE_TYPE: ["RULE_TYPE", "RULETYPE"]
    RULE_SIGN: ["RULE_SIGN", "RULESIGN"]
    RULE_TIME: ["RULE_TIME", "RULETIME"]
    VEHICLE: ["VEHICLE"]
  walk:
    MESH: ["MESH"]
    LINK_ID: ["LINK_ID", "LINKID"]
    NAME: ["NAME"]
    WF_TYPE: ["WF_TYPE", "WFTYPE"]
    LINK_TYPE: ["LINK_TYPE", "LINK TYPE", "LINKTYPE"]
    ISTOLL: ["ISTOLL"]
    CONSTATUS: ["CONSTATUS"]
    DIRECTION: ["DIRECTION", "DIR"]
    SLOPE: ["SLOPE"]
    BLOCK_TYPE: ["BLOCK_TYPE", "BLOCK TYPE"]
    NAVITYPE: ["NAVITYPE"]
    BICYCLE: ["BICYCLE"]
    BI_DIR: ["BI_DIR", "BI DIR"]
    GREENWAY: ["GREENWAY"]
    BW_MARK: ["BW_MARK"]
    BOUND_RB: ["BOUND_RB"]
    BOUND_BW: ["BOUND_BW", "BOUND BW"]
